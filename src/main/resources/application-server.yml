spring:
  jackson:
    time-zone: Asia/Seoul
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        web-allow-others: true
  datasource:
    url: jdbc:h2:mem:test
  jpa:
    hibernate:
      ddl-auto: create  # (1) 스키마 자동 생성
    show-sql: false     # (2) SQL 쿼리 출력 (로그 폭주 방지로 off)
    properties:
      hibernate:
        format_sql: false  # (3) SQL pretty print off
    defer-datasource-initialization: true  # data.sql 실행 시점 조정
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
springdoc:
  default-flat-param-object: true
  use-fqn: true
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    try-it-out-enabled: true
jwt:
  key: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: 100000
  refresh-token-expiration-minutes: 240000
mail:
  smtp:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}  # 민감한 정보는 시스템 환경 변수로..
    password: ${MAIL_PASSWORD}  # 민감한 정보는 시스템 환경 변수로..
    auth: true
    starttls:
      enable: true
  subject:
    member:
      registration: Thank you for joining our cookking!
  template:
    name:
      member:
        join: email-registration-member
  address:
    admin: admin@google.com
cloud:
  aws:
    credentials:
      accessKey: ${AWS_ACCESS_KEY}
      secretKey: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${AWS_BUCKET_NAME}
    stack:
      auto: false
server:
  port: ${PORT:8080}
  servlet:
    encoding:
      force-response: true
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
file:
  upload-dir: /fileImage
payment:
  toss:
    test_client_api_key: test_ck_ZLKGPx4M3MR7vOEM9BBwVBaWypv1
    test_secret_api_key: test_sk_yZqmkKeP8gaKW7Wpagd4VbQRxB9l
